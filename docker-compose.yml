name: xuanxiang

services:
  postgres:
    image: postgres:16-alpine
    container_name: xuanxiang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xuanxiang
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - xuanxiang_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xuanxiang"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xuanxiang_postgres_data:
